name: Add astronomy dependency once

on:
  push:
    branches:
      - feature/real-sky-cycle
    paths:
      - .github/workflows/add-astronomy-engine.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/real-sky-cycle
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Astronomy Engine
        run: |
          npm install astronomy-engine@2.1.19 --save
          npm audit --audit-level=low

      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add astronomy-engine"
          git push origin HEAD:feature/real-sky-cycle
