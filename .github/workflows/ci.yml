name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Run tests and build
        run: npm run check

      - name: Smoke browser runtime
        shell: bash
        run: |
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/city3d-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              break
            fi
            if ! kill -0 "$VITE_PID" 2>/dev/null; then
              cat /tmp/city3d-vite.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:5173 >/dev/null; then
            cat /tmp/city3d-vite.log
            exit 1
          fi

          npm run smoke:browser
