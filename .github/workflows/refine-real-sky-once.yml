name: Refine astronomical sky once

on:
  push:
    branches:
      - feature/real-sky-cycle
    paths:
      - .github/workflows/refine-real-sky-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/real-sky-cycle
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refine celestial geometry and solar events
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              return text.replace(old, new, 1)

          engine_path = Path('src/core/engine.js')
          engine = engine_path.read_text()
          engine = must_replace(
              engine,
              '    0.1,\n    1000\n  );',
              '    0.1,\n    3000\n  );',
              'camera far plane',
          )
          engine_path.write_text(engine)

          path = Path('src/sky/AstronomicalSky.js')
          text = path.read_text()

          text = must_replace(
              text,
              'const SKY_DISTANCE = 700;',
              'const SKY_DISTANCE = 1_600;',
              'sky distance',
          )

          text = must_replace(
              text,
              '    this.container = container;\n    this.observerInfo = { ...FALLBACK_OBSERVER };',
              '    this.container = container;\n\n    // Todo el firmamento sigue la posición de la cámara para mantener distancia\n    // angular infinita y evitar paralaje artificial al recorrer la ciudad.\n    this.celestialRoot = new THREE.Group();\n    this.celestialRoot.name = "celestial-sphere";\n    this.scene.add(this.celestialRoot);\n\n    this.observerInfo = { ...FALLBACK_OBSERVER };',
              'celestial root',
          )

          text = must_replace(
              text,
              '    this.elapsedSinceAstronomyUpdate = Infinity;\n    this.state = null;',
              '    this.elapsedSinceAstronomyUpdate = Infinity;\n    this.state = null;\n    this.solarEvents = null;\n    this.solarEventsKey = null;',
              'solar event cache',
          )

          text = must_replace(
              text,
              '    this.sky.scale.setScalar(450_000);',
              '    this.sky.scale.setScalar(SKY_DISTANCE);',
              'sky scale',
          )

          replacements = [
              ('    this.scene.add(this.sky);', '    this.celestialRoot.add(this.sky);', 'sky root'),
              ('    this.scene.add(this.sun);', '    this.celestialRoot.add(this.sun);', 'sun root'),
              ('    this.scene.add(this.sunGlow);', '    this.celestialRoot.add(this.sunGlow);', 'sun glow root'),
              ('    this.scene.add(this.moon);', '    this.celestialRoot.add(this.moon);', 'moon root'),
              ('      this.scene.add(sprite);', '      this.celestialRoot.add(sprite);', 'planet root'),
              ('      this.scene.add(points);', '      this.celestialRoot.add(points);', 'star root'),
          ]
          for old, new, label in replacements:
              text = must_replace(text, old, new, label)

          old_body = '''function bodyHorizontal(body, date, observer) {\n  const equatorial = Astronomy.Equator(body, date, observer, true, true);\n  const horizontal = Astronomy.Horizon(\n    date,\n    observer,\n    equatorial.ra,\n    equatorial.dec,\n    "normal"\n  );\n\n  return { equatorial, horizontal };\n}\n'''
          new_body = '''function bodyHorizontal(body, date, observer) {\n  const equatorial = Astronomy.Equator(body, date, observer, true, true);\n  const horizontal = Astronomy.Horizon(\n    date,\n    observer,\n    equatorial.ra,\n    equatorial.dec,\n    "normal"\n  );\n  const geometric = Astronomy.Horizon(\n    date,\n    observer,\n    equatorial.ra,\n    equatorial.dec,\n    null\n  );\n\n  return { equatorial, horizontal, geometric };\n}\n'''
          text = must_replace(text, old_body, new_body, 'dual horizon calculation')

          text = must_replace(
              text,
              '        this.elapsedSinceAstronomyUpdate = Infinity;\n      },',
              '        this.elapsedSinceAstronomyUpdate = Infinity;\n        this.solarEventsKey = null;\n      },',
              'geolocation event reset',
          )

          text = must_replace(
              text,
              '  update(deltaSeconds) {\n    this.updateCloudMotion(deltaSeconds);',
              '  update(deltaSeconds) {\n    this.celestialRoot.position.copy(this.engine.camera.position);\n    this.updateCloudMotion(deltaSeconds);',
              'camera-follow update',
          )

          text = must_replace(
              text,
              '    const sunAltitude = sunState.horizontal.altitude;',
              '    // El crepúsculo se clasifica con la altura geométrica del centro\n    // solar; la posición visual conserva refracción atmosférica.\n    const sunAltitude = sunState.geometric.altitude;',
              'geometric solar altitude',
          )

          text = must_replace(
              text,
              '    const phase = getTwilightPhase(sunAltitude);\n\n    const sunDirection = this.updateSun(sunState);',
              '    const phase = getTwilightPhase(sunAltitude);\n    this.updateSolarEvents(date);\n\n    const sunDirection = this.updateSun(sunState);',
              'solar event update',
          )

          text = must_replace(
              text,
              '      observer: { ...this.observerInfo },\n      sun: {',
              '      observer: { ...this.observerInfo },\n      solarEvents: this.solarEvents\n        ? { ...this.solarEvents }\n        : null,\n      sun: {',
              'state solar events',
          )

          text = must_replace(
              text,
              '    const visible = sunState.horizontal.altitude > -1.2;',
              '    const angularRadiusDeg = THREE.MathUtils.radToDeg(angularRadius);\n    // El disco aparece cuando su borde superior cruza el horizonte aparente.\n    const visible = sunState.horizontal.altitude > -angularRadiusDeg;',
              'sun limb visibility',
          )

          text = must_replace(
              text,
              '    this.moon.scale.setScalar(Math.max(0.01, worldRadius));\n    this.moon.visible = moonState.horizontal.altitude > -1.2;',
              '    this.moon.scale.setScalar(Math.max(0.01, worldRadius));\n    const angularRadiusDeg = THREE.MathUtils.radToDeg(angularRadius);\n    this.moon.visible = moonState.horizontal.altitude > -angularRadiusDeg;',
              'moon limb visibility',
          )

          solar_method = '''\n  updateSolarEvents(date) {\n    const minuteKey = `${this.observerInfo.latitude.toFixed(5)}:${this.observerInfo.longitude.toFixed(5)}:${Math.floor(date.getTime() / 60_000)}`;\n    if (minuteKey === this.solarEventsKey) return;\n\n    this.solarEventsKey = minuteKey;\n    const sunrise = Astronomy.SearchRiseSet(\n      Astronomy.Body.Sun,\n      this.observer,\n      +1,\n      date,\n      2\n    );\n    const sunset = Astronomy.SearchRiseSet(\n      Astronomy.Body.Sun,\n      this.observer,\n      -1,\n      date,\n      2\n    );\n\n    this.solarEvents = {\n      sunrise: sunrise?.date ?? null,\n      sunset: sunset?.date ?? null,\n    };\n  }\n'''
          text = must_replace(
              text,
              '\n  updateHud() {\n',
              solar_method + '\n  updateHud() {\n',
              'solar events method',
          )

          old_hud_anchor = '''    const venus = this.state.planets.Venus;\n    const location =\n      this.observerInfo.source === "geolocation"\n        ? `GPS ${this.observerInfo.latitude.toFixed(2)}°, ${this.observerInfo.longitude.toFixed(2)}°`\n        : this.observerInfo.label;\n\n    const venusText =\n'''
          new_hud_anchor = '''    const venus = this.state.planets.Venus;\n    const location =\n      this.observerInfo.source === "geolocation"\n        ? `GPS ${this.observerInfo.latitude.toFixed(2)}°, ${this.observerInfo.longitude.toFixed(2)}°`\n        : this.observerInfo.label;\n    const formatEventTime = (value) =>\n      value\n        ? new Intl.DateTimeFormat("es-MX", {\n            hour: "2-digit",\n            minute: "2-digit",\n            hour12: false,\n          }).format(new Date(value))\n        : "—";\n    const sunriseText = formatEventTime(this.state.solarEvents?.sunrise);\n    const sunsetText = formatEventTime(this.state.solarEvents?.sunset);\n\n    const venusText =\n'''
          text = must_replace(text, old_hud_anchor, new_hud_anchor, 'HUD event formatter')

          text = must_replace(
              text,
              '      <div>${PHASE_LABELS[this.state.phase]} · Sol ${this.state.sun.altitude.toFixed(1)}° · Luna ${this.state.moon.altitude.toFixed(1)}° (${moonPercent}%)</div>\n      <div style="opacity:.82;">${venusText} · ${location}</div>',
              '      <div>${PHASE_LABELS[this.state.phase]} · Sol ${this.state.sun.altitude.toFixed(1)}° · Luna ${this.state.moon.altitude.toFixed(1)}° (${moonPercent}%)</div>\n      <div style="opacity:.86;">Próx. salida ${sunriseText} · puesta ${sunsetText}</div>\n      <div style="opacity:.82;">${venusText} · ${location}</div>',
              'HUD sunrise sunset',
          )

          path.write_text(text)
          PY

          grep -n "celestialRoot\|sunAltitude = sunState.geometric\|updateSolarEvents\|Próx. salida" src/sky/AstronomicalSky.js
          grep -n "3000" src/core/engine.js

      - name: Validate
        run: |
          npm ci
          npm run audit
          npm run check

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sky/AstronomicalSky.js src/core/engine.js
          git commit -m "fix: keep astronomical sky camera-relative and refine solar events"
          git push origin HEAD:feature/real-sky-cycle
