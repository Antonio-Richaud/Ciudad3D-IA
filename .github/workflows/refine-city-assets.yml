name: Refine city assets once

on:
  push:
    branches:
      - feature/city-visual-system
    paths:
      - .github/workflows/refine-city-assets.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/city-visual-system
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove retired assets and procedural towers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          visual_path = Path('src/city/cityVisualSystem.js')
          visual = visual_path.read_text()
          visual = visual.replace('  tower: "#253041",\n', '')
          visual = visual.replace('  darkWindow: "#171a20",\n', '')
          visual = visual.replace('  warmWindow: "#ffd978",\n', '')
          visual = re.sub(
              r'  treeHouse: Object\.freeze\(\{.*?\n  \}\),\n  pine:',
              '  pine:',
              visual,
              flags=re.S,
          )
          visual = re.sub(
              r'\nexport const TREE_HOUSE_LAYOUT = Object\.freeze\(\{.*?\n\}\);\n\nexport const PIZZERIA_LAYOUT',
              '\nexport const PIZZERIA_LAYOUT',
              visual,
              flags=re.S,
          )
          visual = re.sub(
              r'\nexport function isDowntownLot\(gridX, gridZ, halfGrid\) \{.*?\n\}\n?$',
              '\n',
              visual,
              flags=re.S,
          )
          visual_path.write_text(visual)

          scene_path = Path('src/city/cityScene.js')
          scene = scene_path.read_text()
          scene = scene.replace('  TREE_HOUSE_LAYOUT,\n', '')
          scene = scene.replace('  isDowntownLot,\n', '')
          scene = re.sub(
              r'  \},\n  \{\n    id: "tree-house",.*?\n  \},\n\];',
              '  },\n];',
              scene,
              count=1,
              flags=re.S,
          )
          scene = re.sub(
              r'\nfunction createBuildingTexture\(type, gridX, gridZ\) \{.*?\n\}\n\nfunction createFallbackTree',
              '\nfunction createFallbackTree',
              scene,
              flags=re.S,
          )
          scene = re.sub(
              r'\nfunction createTower\(\{ gridX, gridZ, worldX, worldZ, cellSize \}\) \{.*?\n\}\n\nfunction getVisualLotAt',
              '\nfunction getVisualLotAt',
              scene,
              flags=re.S,
          )
          scene = re.sub(
              r'\n      if \(isDowntownLot\(gridX, gridZ, halfGrid\)\) \{.*?\n        continue;\n      \}\n',
              '\n',
              scene,
              flags=re.S,
          )
          scene_path.write_text(scene)

          test_path = Path('tests/cityVisualSystem.test.js')
          tests = test_path.read_text()
          tests = tests.replace('  TREE_HOUSE_LAYOUT,\n', '')
          tests = tests.replace('  isDowntownLot,\n', '')
          tests = re.sub(
              r'\ntest\("exactly one lot is designated as the tree-house landmark".*?\n\}\);\n',
              '\n',
              tests,
              flags=re.S,
          )
          tests = re.sub(
              r'\ntest\("downtown detection keeps the central district procedural".*?\n\}\);\n',
              '\n',
              tests,
              flags=re.S,
          )
          anchor = '''test("residential model selection is deterministic", () => {\n  const first = getResidentialModelKey(1, 1, 6);\n  const second = getResidentialModelKey(1, 1, 6);\n\n  assert.equal(first, second);\n  assert.ok(["house", "largeHouse"].includes(first));\n});\n'''
          replacement = anchor + '''\ntest("retired tree-house model is no longer part of the runtime library", () => {\n  assert.equal("treeHouse" in MODEL_LIBRARY, false);\n});\n'''
          if anchor not in tests:
              raise SystemExit('Could not find residential model test anchor')
          tests = tests.replace(anchor, replacement)
          test_path.write_text(tests)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace(
              '- calles, intersecciones, banquetas, cruces peatonales, edificios y árboles;',
              '- calles, intersecciones, banquetas, cruces peatonales, viviendas y árboles;',
          )
          readme = readme.replace(
              '- modelos GLB especiales para casa, tienda y parque;',
              '- modelos GLB para viviendas, tienda, parque, pizzería y vegetación;',
          )
          old_models = '''Actualmente la ciudad carga directamente:\n\n- `casa.glb`\n- `tienda.glb`\n- `parque.glb`\n\nExisten otros modelos preparados para futuras expansiones del entorno.'''
          new_models = '''Actualmente la ciudad carga directamente:\n\n- `casa.glb`\n- `casa-grande.glb`\n- `tienda.glb`\n- `parque.glb`\n- `pizzeria.glb`\n- `pino.glb`\n\nPor ahora no se generan torres ni edificios procedurales: los lotes ordinarios usan viviendas hasta contar con nuevos modelos de edificios diseñados específicamente para la ciudad.'''
          if old_models not in readme:
              raise SystemExit('Could not find README model section')
          readme = readme.replace(old_models, new_models)
          readme = readme.replace(
              '│   └── cityScene.js',
              '│   ├── cityScene.js\n│   └── cityVisualSystem.js',
          )
          readme = readme.replace(
              'tests/\n└── pathPlanner.test.js',
              'tests/\n├── cityVisualSystem.test.js\n└── pathPlanner.test.js',
          )
          readme_path.write_text(readme)
          PY

          git rm public/models/casa-arbol.glb

      - name: Validate
        run: |
          npm ci
          npm run audit
          npm run check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/city/cityScene.js src/city/cityVisualSystem.js tests/cityVisualSystem.test.js README.md public/models/casa-arbol.glb
          git commit -m "chore: remove tree house and procedural towers"
          git push origin HEAD:feature/city-visual-system
